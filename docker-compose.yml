services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-honatu}
      POSTGRES_PASSWORD: ${DB_PASS:-honatu}
      POSTGRES_DB: ${DB_NAME:-honatu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-honatu} -d ${DB_NAME:-honatu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-honatu}
      DB_USER: ${DB_USER:-honatu}
      DB_PASS: ${DB_PASS:-honatu}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"

volumes:
  postgres_data:
