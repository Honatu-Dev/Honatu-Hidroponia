<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios | Honatu</title>
  <meta name="description" content="Servicios integrales de hidroponía: asesoría técnica, venta de insumos, construcción de invernaderos y talleres de capacitación.">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/pages/home.css">
  <link rel="icon" href="../../assets/logo/Logo.png" type="image/png">

  <script type="module" src="../../js/app.js"></script>
</head>

<body>

  <!-- LOADER -->
  <div id="loader" class="loader" aria-hidden="false">
    <div class="loader-inner">
      <img src="../../assets/logo/Logo.png" alt="Honatu" class="loader-logo">
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <honatu-header></honatu-header>

  <main style="padding-top: var(--nav-height, 80px); background: var(--color-cream); min-height: 100vh;">


    <!-- FORM SECTION (General) -->
    <section id="solicitar-servicio" style="padding: var(--space-4xl) 0 var(--space-5xl); background: var(--color-cream-warm); border-top: 1px solid var(--color-gray-200);">
      <div class="container" style="max-width: 800px;">
        <div class="section-header reveal" style="text-align: center; margin-bottom: 2.5rem;">
          <span class="section-eyebrow" style="justify-content: center; color: var(--color-terracotta);">Atención personalizada</span>
          <h2 class="section-title" style="font-size: 2.3rem;">Solicitar Información o Cotización</h2>
          <p class="section-subtitle">Completa el formulario y un especialista de Honatu se comunicará contigo a la brevedad.</p>
        </div>

        <div id="formWrapper" class="reveal servicio-form-wrapper" data-delay="1"
          style="background: var(--color-white); padding: var(--space-2xl); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); border: 1px solid var(--color-gray-200); transition: all 0.3s ease;">
          <form id="servicioForm" style="display: flex; flex-direction: column; gap: var(--space-lg);">

            <div style="display: flex; flex-direction: column; gap: var(--space-xs);">
              <label for="tipo_servicio" style="font-weight: 600; color: var(--color-forest);">Servicio de Interés
                *</label>
              <select id="tipo_servicio" name="tipo_servicio" required
                style="padding: var(--space-md); border: 1px solid var(--color-sage); border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; color: var(--color-forest); background: var(--color-off-white);">
                <option value="" disabled selected>Selecciona un servicio</option>
                <option value="asesoria">Asesoría especializada</option>
                <option value="insumos">Venta de insumos</option>
                <option value="construccion">Construcción de invernaderos</option>
                <option value="talleres">Talleres y capacitación</option>
              </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
              <div style="display: flex; flex-direction: column; gap: var(--space-xs);">
                <label for="nombre" style="font-weight: 600; color: var(--color-forest);">Nombre Completo *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre y apellido"
                  style="padding: var(--space-md); border: 1px solid var(--color-sage); border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; color: var(--color-forest);">
              </div>
              <div style="display: flex; flex-direction: column; gap: var(--space-xs);">
                <label for="email" style="font-weight: 600; color: var(--color-forest);">Correo Electrónico *</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com"
                  style="padding: var(--space-md); border: 1px solid var(--color-sage); border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; color: var(--color-forest);">
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: var(--space-xs);">
              <label for="telefono" style="font-weight: 600; color: var(--color-forest);">Teléfono / WhatsApp</label>
              <input type="tel" id="telefono" name="telefono" placeholder="+52 442 123 4567"
                style="padding: var(--space-md); border: 1px solid var(--color-sage); border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; color: var(--color-forest);">
            </div>

            <div style="display: flex; flex-direction: column; gap: var(--space-xs);">
              <label for="mensaje" style="font-weight: 600; color: var(--color-forest);">Cuéntanos sobre tu proyecto
                *</label>
              <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Describe brevemente tus requerimientos o dudas..."
                style="padding: var(--space-md); border: 1px solid var(--color-sage); border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; resize: vertical; color: var(--color-forest);"></textarea>
            </div>

            <div style="display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap; margin-top: var(--space-sm);">
              <button type="submit" class="btn btn-primary" style="background: #D36A44; border-color: #D36A44;">
                Enviar Solicitud
              </button>
              <span style="font-size: 0.85rem; color: var(--color-gray-500);">Respuesta en menos de 24 horas</span>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer"></footer>

  <script>
    // ============ GENERAL SERVICE FORM ============
    window.selectService = function(serviceKey) {
      const select = document.getElementById("tipo_servicio");
      if (select) {
        select.value = serviceKey;
      }

      if (serviceKey === 'asesoria') {
        window.location.href = './agendar.html';
        return;
      }

      const formSection = document.getElementById("solicitar-servicio");
      const formWrapper = document.getElementById("formWrapper");

      if (formSection) {
        formSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      if (formWrapper) {
        formWrapper.style.boxShadow = "0 0 0 3px rgba(211, 106, 68, 0.4), var(--shadow-lg)";
        setTimeout(() => {
          formWrapper.style.boxShadow = "var(--shadow-md)";
        }, 1500);
      }
    };

    // Auto-seleccionar el servicio basado en el parámetro URL
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const servicioParam = params.get("servicio");

      if (servicioParam) {
        // Small delay to let the page render first
        setTimeout(() => {
          window.selectService(servicioParam);
        }, 600);
      }
    });
  </script>
</body>

</html>
