<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda | Honatu Insumos Hidropónicos</title>
  <meta name="description"
    content="Explora nuestro catálogo completo de nutrientes, sustratos y sistemas hidropónicos.">

  <!-- Google Fonts: Besley (Display/Heading) & Plus Jakarta Sans (Body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/pages/ecommerce.css">
  <link rel="icon" href="../../assets/logo/Logo.png" type="image/png">
  <script type="module" src="../../js/app.js"></script>
</head>

<body>

  <!-- LOADER -->
  <div id="loader" class="loader" aria-hidden="false">
    <div class="loader-inner">
      <img src="../../assets/logo/Logo.png" alt="Honatu" class="loader-logo">
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <honatu-header></honatu-header>

  <!-- TIENDA COMPLETA -->
  <main style="padding-top: calc(var(--nav-height, 84px) + 24px);">
    <section class="shop">
      <div class="container">
        <div class="shop-header reveal">
          <div>
            <h1 class="section-title">Catálogo Completo</h1>
            <p class="section-subtitle">Todo lo que necesitas para tu cultivo hidropónico.</p>
          </div>
          <div class="shop-filters">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="nutrientes">Nutrientes</button>
            <button class="filter-btn" data-filter="sustratos">Sustratos</button>
            <button class="filter-btn" data-filter="sistemas">Sistemas</button>
            <button class="filter-btn" data-filter="herramientas">Herramientas</button>
          </div>
        </div>

        <div id="shopGrid" class="shop-grid">
          <!-- Los productos se renderizarán dinámicamente desde la base de datos aquí -->
          <p style="grid-column: 1 / -1; text-align: center; color: var(--color-gray-500); padding: 40px 0;">Cargando catálogo de productos...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- SLIDE-IN CART -->
  <div id="cartOverlay" class="cart-overlay"></div>
  <aside id="cartPanel" class="cart-panel" aria-label="Carrito de compras">
    <div class="cart-header">
      <h3>Tu Carrito</h3>
      <button id="cartClose" class="cart-close" aria-label="Cerrar carrito">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-footer">
      <div class="cart-total">
        <span class="cart-total-label">Total:</span>
        <span id="cartTotal" class="cart-total-value">$0 MXN</span>
      </div>
      <a href="../shop/cart.html" class="btn btn-terracotta btn-checkout"
        style="text-decoration: none; text-align: center;">Ver Carrito Completo <span class="btn-icon">&rarr;</span></a>
    </div>
  </aside>

  <!-- LOGIN MODAL -->
  <div id="loginOverlay" class="login-overlay"></div>
  <div id="loginModal" class="login-modal" aria-hidden="true" role="dialog">
    <div class="login-modal-content">
      <button id="loginClose" class="login-close" aria-label="Cerrar modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>

      <div class="login-header">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <h2 id="loginTitle">Inicia Sesión</h2>
        <p id="loginSubtitle">Inicia sesión primero para poder comprar.</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Ingresar</button>
      </form>

      <div class="login-footer">
        <p>¿No tienes cuenta? <a href="#" style="color: var(--color-forest); font-weight: 600;">Regístrate</a></p>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer"></footer>

</body>

</html>
