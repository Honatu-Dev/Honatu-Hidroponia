<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras | Honatu</title>
  <meta name="description" content="Revisa tu carrito de compras y procede al pago seguro.">

  <link rel="stylesheet" href="../../css/main.css">

  <link rel="stylesheet" href="../../css/pages/ecommerce.css">
  <link rel="icon" href="../../assets/logo/Logo.png" type="image/png">
  <script type="module" src="../../js/app.js"></script>
</head>

<body>

  <!-- LOADER -->
  <div id="loader" class="loader" aria-hidden="false">
    <div class="loader-inner">
      <img src="../../assets/logo/Logo.png" alt="Honatu" class="loader-logo">
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav id="navbar" class="navbar navbar--solid" role="navigation">
    <div class="nav-container">
      <div style="display: flex; align-items: center; gap: 16px;">
        <a href="../../index.html" class="nav-logo" aria-label="Inicio">
          <img src="../../assets/logo/Logo.png" alt="Honatu">
        </a>
        <a href="../../index.html" class="btn-nav-back">&larr; Volver al Inicio</a>
      </div>
      <div class="nav-right">
        <button id="userLoginToggle" class="nav-cart" aria-label="Usuario">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main style="padding-top: 120px; padding-bottom: 80px;">
    <div class="container">
      <h1 class="section-title" style="margin-bottom: var(--space-2xl);">Tu Carrito</h1>

      <div class="checkout-layout">
        <div class="checkout-items" id="fullCartItems">
          <!-- Populated by JS -->
          <p style="color: var(--color-gray-500);">Cargando carrito...</p>
        </div>

        <div class="checkout-summary">
          <h3>Resumen del Pedido</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="checkoutSubtotal">$0 MXN</span>
          </div>
          <div class="summary-row">
            <span>Envío Estimado</span>
            <span>$150 MXN</span>
          </div>
          <hr style="margin: var(--space-md) 0; border: none; border-top: 1px solid var(--color-gray-200);">
          <div class="summary-row summary-total">
            <span>Total</span>
            <span id="checkoutTotal">$0 MXN</span>
          </div>
          <button type="button" id="btnFinalizarCompra" class="btn btn-terracotta"
            style="width: 100%; margin-top: var(--space-lg); justify-content: center; cursor: pointer;">Finalizar Compra</button>

          <div
            style="margin-top: var(--space-lg); display: flex; align-items: center; gap: 8px; color: var(--color-gray-500); font-size: 0.85rem; justify-content: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Pago Seguro Encriptado
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer"></footer>

  <!-- AUTH MODAL -->
  <div id="loginOverlay" class="login-overlay"></div>
  <div id="loginModal" class="login-modal" aria-hidden="true" role="dialog"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Re-render cart specifically for full checkout page
      const cart = JSON.parse(localStorage.getItem('honatu-cart') || '[]');
      const fullCartItems = document.getElementById('fullCartItems');
      const checkoutSubtotal = document.getElementById('checkoutSubtotal');
      const checkoutTotal = document.getElementById('checkoutTotal');
      const btnFinalizarCompra = document.getElementById('btnFinalizarCompra');

      const calcTotal = () => cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const renderFullCart = () => {
        if (!fullCartItems) return;

        if (cart.length === 0) {
          fullCartItems.innerHTML = '<div style="text-align: center; padding: var(--space-3xl) 0; color: var(--color-gray-400);">Tu carrito está vacío. <br><br><a href="../shop/shop.html" class="btn btn-secondary">Ir a la tienda</a></div>';
          checkoutSubtotal.textContent = '$0 MXN';
          checkoutTotal.textContent = '$0 MXN';
          return;
        }

        fullCartItems.innerHTML = cart.map(item => `
          <div class="checkout-item" data-id="${item.id}">
            <img src="${item.img}" alt="${item.name}">
            <div class="checkout-item-info">
              <h4>${item.name}</h4>
              <p class="price">$${item.price.toLocaleString('es-MX')} MXN</p>
            </div>
            <div class="checkout-item-qty">
              <span>Cant: ${item.qty}</span>
            </div>
          </div>
        `).join('');

        const sub = calcTotal();
        checkoutSubtotal.textContent = '$' + sub.toLocaleString('es-MX') + ' MXN';
        checkoutTotal.textContent = '$' + (sub + 150).toLocaleString('es-MX') + ' MXN';
      };

      if (btnFinalizarCompra) {
        btnFinalizarCompra.addEventListener('click', (e) => {
          e.preventDefault();
          if (cart.length === 0) {
            if (window.showToast) {
              window.showToast("Tu carrito está vacío.");
            } else {
              alert("Tu carrito está vacío.");
            }
            return;
          }

          const isAuth = localStorage.getItem('honatu-auth') === 'true';
          if (!isAuth) {
            if (typeof window.openLoginModal === 'function') {
              window.openLoginModal({
                redirectTo: 'checkout.html',
                subtitle: 'Inicia sesión o regístrate para confirmar tu compra.'
              });
            }
            return;
          }

          // If authenticated, navigate straight to checkout
          window.location.href = 'checkout.html';
        });
      }

      renderFullCart();
    });
  </script>
</body>

</html>
